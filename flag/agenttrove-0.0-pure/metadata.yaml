name: AgentThrove 0.0 pure
huggingface: https://huggingface.co/datasets/open-thoughts/AgentTrove
suffix: .jsonl.zst
id: uuid
text: text
#
megatron-lm:
  default:
    source: release
  openeurollm-256k-without-bos:
    bos: false
    huggingface: openeurollm/tokenizer-256k
  openeurollm-256k-reason-without-bos:
    bos: false
    huggingface: openeurollm/tokenizer-256k-reason
    

#
release:
  default:
    input: uuid
    annotations: [nemo-curator]
    pack: tree
    sample: full
  data:
    shard: 2md
#
nemo-curator:
  default:
    input: uuid
